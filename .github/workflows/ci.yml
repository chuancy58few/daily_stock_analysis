name: CI

on:
  push:
    branches:
      - analysis/a-hkconnect-buy-now-20260816
    paths:
      - scripts/scan_buy_now_candidates.py
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: buy-now-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install data dependencies
        run: pip install 'requests>=2.31.0' 'akshare>=1.17.0'

      - name: Run sample multi-factor screen
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/scan_buy_now_candidates.py \
            --limit-a 160 \
            --limit-hk 80 \
            --workers 12 \
            --requests-per-second 10 \
            --hk-finance-workers 6 \
            --hk-finance-requests-per-second 4 \
            --history-count 72 \
            --output-dir reports/buy_now_sample \
            --checkpoint-dir .cache/buy_now_sample

      - name: Show sample output
        if: always()
        run: |
          cat reports/buy_now_sample/筛选摘要.json || true
          echo ''
          echo 'Top buyable:'
          head -16 reports/buy_now_sample/适合分批建首仓.csv || true
          echo ''
          echo 'Failures:'
          cat reports/buy_now_sample/抓取失败清单.csv || true

      - name: Upload sample results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A股港股通买入筛选样本-${{ github.run_number }}
          path: reports/buy_now_sample/
          if-no-files-found: warn
          retention-days: 7
