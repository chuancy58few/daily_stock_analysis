name: CI

on:
  push:
    branches:
      - analysis/a-share-5y-drawdown-20260815
    paths:
      - scripts/probe_a_share_data_sources.py
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: a-share-source-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'requests>=2.31.0' 'pandas>=2.0.0' 'openpyxl>=3.1.0' 'baostock>=0.8.9' 'akshare>=1.17.0'

      - name: Probe public sources
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/probe_a_share_data_sources.py

      - name: Show probe result
        if: always()
        run: cat reports/a_share_source_probe/source_probe.json || true

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-share-source-probe-${{ github.run_number }}
          path: reports/a_share_source_probe/
          if-no-files-found: warn
          retention-days: 7
