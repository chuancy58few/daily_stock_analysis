name: CI

on:
  push:
    branches:
      - analysis/a-share-5y-drawdown-20260815
    paths:
      - scripts/scan_a_share_5y_drawdown_sina_qfq.py
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: a-share-five-year-drawdown-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-market-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'requests>=2.31.0' 'pandas>=2.0.0' 'numpy>=1.24.0'

      - name: Restore resumable checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .cache/a_share_5y_drawdown_sina_qfq
          key: a-share-5y-drawdown-sina-qfq-${{ github.run_id }}
          restore-keys: |
            a-share-5y-drawdown-sina-qfq-

      - name: Run full current A-share screen
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/scan_a_share_5y_drawdown_sina_qfq.py \
            --start-date 20210816 \
            --end-date 20260814 \
            --threshold-ratio 5 \
            --max-workers 10 \
            --max-requests-per-second 10 \
            --retry-rounds 2 \
            --output-dir reports/a_share_5y_drawdown \
            --checkpoint-dir .cache/a_share_5y_drawdown_sina_qfq

      - name: Show screening summary
        if: always()
        run: |
          cat reports/a_share_5y_drawdown/筛选摘要.json || true
          echo ''
          echo 'Generated files:'
          find reports/a_share_5y_drawdown -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true

      - name: Save resumable checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/a_share_5y_drawdown_sina_qfq
          key: a-share-5y-drawdown-sina-qfq-${{ github.run_id }}

      - name: Upload screening results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-share-five-year-drawdown-${{ github.run_number }}
          path: reports/a_share_5y_drawdown/
          if-no-files-found: warn
          retention-days: 30
