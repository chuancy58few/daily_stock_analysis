name: CI

on:
  push:
    branches:
      - analysis/a-share-5y-drawdown-20260815
    paths:
      - scripts/scan_a_share_5y_drawdown_sina_qfq.py
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: a-share-drawdown-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'requests>=2.31.0' 'pandas>=2.0.0' 'numpy>=1.24.0'

      - name: Run 50-stock validation sample
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/scan_a_share_5y_drawdown_sina_qfq.py \
            --start-date 20210816 \
            --end-date 20260814 \
            --threshold-ratio 5 \
            --max-workers 6 \
            --max-requests-per-second 8 \
            --retry-rounds 1 \
            --limit 50 \
            --output-dir reports/a_share_5y_drawdown_sample \
            --checkpoint-dir .cache/a_share_5y_drawdown_sample

      - name: Show sample summary
        if: always()
        run: |
          cat reports/a_share_5y_drawdown_sample/筛选摘要.json || true
          echo ''
          head -5 reports/a_share_5y_drawdown_sample/A股近5年全市场最大回撤.csv || true

      - name: Upload validation sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-share-drawdown-sample-${{ github.run_number }}
          path: reports/a_share_5y_drawdown_sample/
          if-no-files-found: warn
          retention-days: 7
