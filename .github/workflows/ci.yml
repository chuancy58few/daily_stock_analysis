name: CI

on:
  push:
    branches:
      - analysis/ah-double-spike-pattern-20260816
    paths:
      - scripts/scan_ah_double_spike_pattern.py
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: ah-pattern-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install requests
        run: pip install 'requests>=2.31.0'

      - name: Run sample validation
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/scan_ah_double_spike_pattern.py \
            --limit-a 120 \
            --limit-hk 120 \
            --workers 10 \
            --requests-per-second 10 \
            --top-series-count 12 \
            --output-dir reports/ah_double_spike_sample \
            --checkpoint-dir .cache/ah_double_spike_sample

      - name: Show result
        if: always()
        run: |
          cat reports/ah_double_spike_sample/筛选摘要.json || true
          echo ''
          head -10 reports/ah_double_spike_sample/高相似严格候选.csv || true
          echo ''
          cat reports/ah_double_spike_sample/抓取失败清单.csv || true

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ah-pattern-sample-${{ github.run_number }}
          path: reports/ah_double_spike_sample/
          if-no-files-found: warn
          retention-days: 7
