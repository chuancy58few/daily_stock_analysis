name: CI

on:
  push:
    branches:
      - analysis/a-hkconnect-l1-setup-20260816
    paths:
      - scripts/scan_l1_setup_candidates.py
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: l1-stage-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install requests
        run: pip install 'requests>=2.31.0'

      - name: Run sample L1-stage scan
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/scan_l1_setup_candidates.py \
            --limit-a 220 \
            --limit-hk 220 \
            --workers 12 \
            --requests-per-second 11 \
            --top-series-count 20 \
            --output-dir reports/l1_sample \
            --checkpoint-dir .cache/l1_sample

      - name: Show sample result
        if: always()
        run: |
          cat reports/l1_sample/筛选摘要.json || true
          echo ''
          echo 'Core candidates:'
          head -12 reports/l1_sample/核心候选.csv || true
          echo ''
          echo 'Failures:'
          cat reports/l1_sample/抓取失败清单.csv || true

      - name: Upload sample result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: L1阶段样本验证-${{ github.run_number }}
          path: reports/l1_sample/
          if-no-files-found: warn
          retention-days: 7
