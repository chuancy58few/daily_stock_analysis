name: CI

on:
  push:
    branches:
      - analysis/a-share-5y-drawdown-20260815
    paths:
      - scripts/probe_sina_adjustment.py
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: a-share-sina-adjustment-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adjustment-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install requests
        run: pip install 'requests>=2.31.0'

      - name: Compare price series
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/probe_sina_adjustment.py

      - name: Show result
        if: always()
        run: cat reports/sina_adjustment_probe/probe.json || true

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sina-adjustment-probe-${{ github.run_number }}
          path: reports/sina_adjustment_probe/
          if-no-files-found: warn
          retention-days: 7
