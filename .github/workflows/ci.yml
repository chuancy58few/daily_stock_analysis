name: CI

on:
  push:
    branches:
      - analysis/a-share-5y-drawdown-20260815
    paths:
      - scripts/probe_bse_history_mapping.py
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: a-share-bse-history-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bse-history-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install probe dependencies
        run: pip install 'requests>=2.31.0' 'pandas>=2.0.0' 'lxml>=5.0.0'

      - name: Probe BSE history
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/probe_bse_history_mapping.py

      - name: Show result
        if: always()
        run: cat reports/bse_history_probe/probe.json || true

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bse-history-probe-${{ github.run_number }}
          path: reports/bse_history_probe/
          if-no-files-found: warn
          retention-days: 7
