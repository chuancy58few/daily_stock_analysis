name: CI

on:
  push:
    branches:
      - analysis/ah-double-spike-pattern-20260816
    paths:
      - scripts/scan_ah_double_spike_pattern.py
      - scripts/run_ah_double_spike_pattern_v2.py
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: ah-pattern-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-market-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install requests
        run: pip install 'requests>=2.31.0'

      - name: Restore resumable checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .cache/ah_double_spike_full
          key: ah-double-spike-full-${{ github.run_id }}
          restore-keys: |
            ah-double-spike-full-

      - name: Run full A and HK screen
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/run_ah_double_spike_pattern_v2.py \
            --workers 16 \
            --requests-per-second 14 \
            --history-count 260 \
            --min-history-months 60 \
            --top-series-count 40 \
            --output-dir reports/ah_double_spike_pattern \
            --checkpoint-dir .cache/ah_double_spike_full

      - name: Show result
        if: always()
        run: |
          cat reports/ah_double_spike_pattern/筛选摘要.json || true
          echo ''
          echo 'Top strict candidates:'
          head -16 reports/ah_double_spike_pattern/高相似严格候选.csv || true
          echo ''
          echo 'Failures:'
          wc -l reports/ah_double_spike_pattern/抓取失败清单.csv || true

      - name: Save resumable checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/ah_double_spike_full
          key: ah-double-spike-full-${{ github.run_id }}

      - name: Upload screening results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A股港股正大生物相似走势筛选-${{ github.run_number }}
          path: reports/ah_double_spike_pattern/
          if-no-files-found: warn
          retention-days: 30
