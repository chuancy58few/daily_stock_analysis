name: CI

on:
  push:
    branches:
      - analysis/a-hkconnect-l1-setup-20260816
    paths:
      - scripts/scan_l1_setup_candidates.py
      - scripts/run_l1_setup_v2.py
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: l1-stage-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-l1-stage-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install requests
        run: pip install 'requests>=2.31.0'

      - name: Restore resumable checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .cache/a_hkconnect_l1_setup
          key: a-hkconnect-l1-${{ github.run_id }}
          restore-keys: |
            a-hkconnect-l1-

      - name: Run full L1-stage screen
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/run_l1_setup_v2.py \
            --workers 16 \
            --requests-per-second 14 \
            --history-count 260 \
            --min-history-months 60 \
            --top-series-count 80 \
            --output-dir reports/a_hkconnect_l1_setup \
            --checkpoint-dir .cache/a_hkconnect_l1_setup

      - name: Show result
        if: always()
        run: |
          cat reports/a_hkconnect_l1_setup/筛选摘要.json || true
          echo ''
          echo 'Top core candidates:'
          head -26 reports/a_hkconnect_l1_setup/核心候选.csv || true
          echo ''
          echo 'Top just-started candidates:'
          head -20 reports/a_hkconnect_l1_setup/刚启动候选.csv || true
          echo ''
          echo 'Failures:'
          wc -l reports/a_hkconnect_l1_setup/抓取失败清单.csv || true

      - name: Save resumable checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/a_hkconnect_l1_setup
          key: a-hkconnect-l1-${{ github.run_id }}

      - name: Upload screening results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A股港股通L1筑底刚启动筛选-${{ github.run_number }}
          path: reports/a_hkconnect_l1_setup/
          if-no-files-found: warn
          retention-days: 30
