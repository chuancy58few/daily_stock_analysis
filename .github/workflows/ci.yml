name: CI

on:
  push:
    branches:
      - analysis/a-hkconnect-buy-now-20260816
    paths:
      - scripts/scan_buy_now_candidates.py
      - scripts/run_buy_now_v2.py
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: buy-now-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-market-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install data dependencies
        run: pip install 'requests>=2.31.0' 'akshare>=1.17.0'

      - name: Run full multi-factor screen
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/run_buy_now_v2.py \
            --workers 16 \
            --requests-per-second 14 \
            --hk-finance-workers 8 \
            --hk-finance-requests-per-second 5 \
            --history-count 72 \
            --output-dir reports/a_hkconnect_buy_now \
            --checkpoint-dir .cache/a_hkconnect_buy_now

      - name: Show result
        if: always()
        run: |
          cat reports/a_hkconnect_buy_now/筛选摘要.json || true
          echo ''
          echo 'Top buyable candidates:'
          head -31 reports/a_hkconnect_buy_now/适合分批建首仓.csv || true
          echo ''
          echo 'Top pullback candidates:'
          head -16 reports/a_hkconnect_buy_now/好公司等回调.csv || true
          echo ''
          echo 'Failures:'
          wc -l reports/a_hkconnect_buy_now/抓取失败清单.csv || true

      - name: Upload full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A股港股通全市场当前买入筛选-${{ github.run_number }}
          path: reports/a_hkconnect_buy_now/
          if-no-files-found: warn
          retention-days: 30
