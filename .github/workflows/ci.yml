name: CI

on:
  push:
    branches:
      - analysis/ah-double-spike-pattern-20260816
    paths:
      - scripts/probe_ah_pattern_sources.py
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: ah-pattern-source-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install requests
        run: pip install 'requests>=2.31.0'

      - name: Probe sources
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/probe_ah_pattern_sources.py

      - name: Show result
        if: always()
        run: cat reports/ah_pattern_probe/probe.json || true

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ah-pattern-probe-${{ github.run_number }}
          path: reports/ah_pattern_probe/
          if-no-files-found: warn
          retention-days: 7
