name: CI

on:
  push:
    branches:
      - analysis/a-share-5y-drawdown-20260815
    paths:
      - scripts/scan_a_share_5y_drawdown_eastmoney.py
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: a-share-five-year-drawdown-${{ github.ref }}
  cancel-in-progress: false

jobs:
  a-share-drawdown-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'requests>=2.31.0' 'pandas>=2.0.0' 'numpy>=1.24.0'

      - name: Run full-market scan
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/scan_a_share_5y_drawdown_eastmoney.py \
            --start-date 20210816 \
            --end-date 20260814 \
            --threshold-ratio 5 \
            --max-workers 18 \
            --output-dir reports/a_share_5y_drawdown

      - name: Show result summary
        if: success()
        run: |
          cat reports/a_share_5y_drawdown/筛选摘要.json
          echo ''
          echo 'Generated files:'
          find reports/a_share_5y_drawdown -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload screening results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-share-five-year-drawdown-${{ github.run_number }}
          path: reports/a_share_5y_drawdown/
          if-no-files-found: warn
          retention-days: 30
